name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Package Windows installer and application source
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --publish never

      - name: Obtain matching MuPDF corresponding source
        shell: pwsh
        run: |
          $mupdfVersion = node -p "require('./node_modules/mupdf/package.json').version"
          if ($LASTEXITCODE -ne 0 -or $mupdfVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Unable to identify the packaged MuPDF version.'
          }
          $archiveName = "mupdf-$mupdfVersion-source.tar.gz"
          Invoke-WebRequest -Uri "https://mupdf.com/downloads/archive/$archiveName" -OutFile $archiveName

      - name: Upload installer and corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: Clawdenote-Windows-x64-${{ github.sha }}
          path: |
            release-clawdenote/Clawdenote-Setup-*.exe
            Clawdenote-Source.zip
            mupdf-*-source.tar.gz
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
